# Shared toolchain for both machines; linked as ~/.config/mise/config.toml.
# Update everything with `mise up`. Coding agent CLIs (claude, codex,
# cursor-agent) are not here: shared/install.sh uses their own installers.

[tools]
node = "26"
pnpm = "latest"
gh = "latest"

[settings]
# Projects with .nvmrc / .node-version pick their own Node.
idiomatic_version_file_enable_tools = ["node"]

[settings.upgrade]
auto_prune = false
