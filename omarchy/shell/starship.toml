# Prompt for the PC, styled after the Mac's Powerlevel10k (lean, one line):
# folder name, branch, git counts, then duration and exit code before ❯.
# Bash has no right prompt without ble.sh, so those two sit on the left.
# Colors are ANSI, so they follow the Omarchy theme. Linked as
# ~/.config/starship.toml.

add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$jobs$status$character"

[directory]
style = "blue"
truncation_length = 1
truncate_to_repo = false
truncation_symbol = ""
read_only = " "
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "green"
format = "[$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "~$count"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇡$ahead_count⇣$behind_count"
untracked = "?$count"
stashed = "*$count"
modified = "!$count"
staged = "+$count"
renamed = "+$count"
deleted = "!$count"

[cmd_duration]
min_time = 3_000
style = "yellow"
format = "[$duration]($style) "

[jobs]
style = "green"
format = "[$symbol$number]($style) "

[status]
disabled = false
style = "red"
format = "[✘$status]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
